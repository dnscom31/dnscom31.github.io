<style>

;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:30px}.head p{margin:7px 0;color:#71817e}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #dfe8e6;border-radius:16px;overflow:hidden}.toolbar{padding:14px;display:flex;gap:10px;border-bottom:1px solid #e8efed;flex-wrap:wrap}.search{border:1px solid #d8e4e1;border-radius:10px;padding:10px 12px;min-width:280px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th{background:#f7faf9;font-size:12px;color:#71817e;text-align:left;padding:12px;border-bottom:1px solid #e4ebe9}td{font-size:13px;padding:12px;border-bottom:1px solid #edf1f0;vertical-align:middle}.child{padding-left:30px!important}.muted{color:#8b9996}.good{background:#e5f6ef;color:#127052}.warn{background:#fff4d7;color:#8a6408}.empty{padding:45px;text-align:center;color:#84928f}.hero{background:linear-gradient(135deg,#173f3a,#0f766e);color:#fff;border-radius:18px;padding:24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px}.hero h1{margin:5px 0}.hero select{padding:10px;border-radius:9px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:9px;color:#657572;cursor:pointer}.tabs button.active{background:#e8f5f1;color:#0f766e;font-weight:900}.infogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e1e9e7}.info{background:#fff;padding:20px}.info span{font-size:12px;color:#7b8986}.info b{display:block;margin-top:8px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(#edf7f4,#f7faf9)}.authbox{width:min(580px,100%);background:#fff;border:1px solid #dfe8e6;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(20,65,58,.1)}form{display:grid;gap:13px}label{display:grid;gap:6px;font-size:13px;font-weight:800}input,select,textarea{border:1px solid #d5e2df;border-radius:9px;padding:11px;background:#fff;width:100%}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#f1f7f5;padding:12px;border-radius:10px;color:#60716d;font-size:12px;line-height:1.6}.modal{position:fixed;inset:0;background:rgba(10,30,27,.48);display:grid;place-items:center;padding:18px;z-index:30}.modalbox{background:#fff;border-radius:17px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.linkbox{padding:35px;text-align:center}.generated{display:flex;gap:8px;margin:18px auto;background:#f6faf9;border:1px solid #dce6e3;border-radius:10px;padding:10px;max-width:720px}.generated code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px}.check{display:flex;gap:9px;align-items:flex-start;font-weight:500}.check input{width:auto;margin-top:3px}@media(max-width:850px){.cards{grid-template-columns:1fr}.landing h1{font-size:36px}.shell{grid-template-columns:1fr}aside{display:none}.main{padding:16px}.head{flex-direction:column}.two,.infogrid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}

<script>
const URL='https://capixpcxygqcyjgiclev.supabase.co',KEY='sb_publishable_2ilSpo82JBuAXOWQtstdEQ_ZHa9yDPT';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let session=null,profile=null,state={tab:'companies',companies:[],members:[],selectedCompany:null,q:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), clean=v=>String(v??'').trim();
function brand(){return `<div class="brand"><div class="mark">N</div><div>뉴고려병원<div class="sub">기업 예방접종 명단 포털</div></div></div>`}function go(r){location.hash=r;route()}async function authState(){const {data}=await sb.auth.getSession();session=data.session;profile=null;if(session){const {data:p}=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();profile=p}return session}
function header(title=''){return `<header>${brand()}<div class="actions"><b>${esc(title)}</b>${session?`<button class="btn ghost" onclick="logout()">나가기</button>`:''}</div></header>`}async function logout(){await sb.auth.signOut();session=profile=null;go('home')}
async function route(){await authState();const r=location.hash.slice(1)||'home';if(r.startsWith('register/'))return employeeRegister(r.split('/')[1]);if(r.startsWith('company-invite/'))return invitePage(r.split('/')[1]);if(r==='setup-admin')return setupAdmin();if(r==='hospital'){if(!session)return login('hospital');if(!String(profile?.role||'').startsWith('hospital_'))return denied();return hospital()}if(r==='company'){if(!session)return login('company');if(profile?.role!=='company_admin')return denied();return company()}if(r.startsWith('login/'))return login(r.split('/')[1]);landing()}
function landing(){app.innerHTML=`${header()}<main class="landing"><span class="pill">기업 예방접종</span><h1>사업장과 예방접종 명단을<br>간단하게 관리합니다</h1><p>병원은 사업장 구조와 전체 명단을 확인하고, 기업은 직원 명단을 직접 등록하거나 전용 링크로 받을 수 있습니다.</p><div class="cards"><div class="card" onclick="go('login/company')"><h2>기업 고객용</h2><p>직원 명단 · 표준 엑셀 업로드 · 직원 자가등록 링크</p><b>기업 페이지 열기 →</b></div><div class="card dark" onclick="go('login/hospital')"><h2>병원용</h2><p>사업장·하위사업장 관리 · 전체 명단 확인</p><b>병원 페이지 열기 →</b></div></div></main>`}
function login(type){app.innerHTML=`<div class="auth"><div class="authbox">${brand()}<h1>${type==='hospital'?'병원':'기업'} 로그인</h1><form id="login"><label>이메일<input type="email" name="email" required></label><label>비밀번호<input type="password" name="pw" required></label><button class="btn primary">로그인</button></form>${type==='hospital'?`<button class="btn ghost" onclick="go('setup-admin')">최초 병원 관리자 계정 만들기</button>`:''}<button class="btn ghost" onclick="go('home')">처음으로</button><div id="msg"></div></div></div>`;$('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});if(error)return $('#msg').innerHTML=`<div class="notice">${esc(error.message)}</div>`;await authState();go(type)}}
function setupAdmin(){app.innerHTML=`<div class="auth"><div class="authbox">${brand()}<h1>최초 병원 관리자</h1><form id="setup"><label>이름<input name="name" required></label><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="pw" type="password" minlength="8" required></label><button class="btn primary">계정 만들기</button></form><div id="msg"></div></div></div>`;$('#setup').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{data,error}=await sb.auth.signUp({email:f.get('email'),password:f.get('pw'),options:{data:{display_name:f.get('name')}}});if(error)return $('#msg').innerHTML=`<div class="notice">${esc(error.message)}</div>`;if(data.session){const {error:x}=await sb.rpc('claim_first_hospital_admin',{p_display_name:f.get('name')});if(x)return $('#msg').innerHTML=`<div class="notice">${esc(x.message)}</div>`;return go('hospital')}$('#msg').innerHTML='<div class="notice">이메일 인증 후 병원 로그인으로 들어가 주세요.</div>'}}
function denied(){app.innerHTML=`<div class="auth"><div class="authbox"><h1>접근 권한이 없습니다</h1><button class="btn secondary" onclick="logout()">로그아웃</button></div></div>`}
function mapCompany(c){return{id:c.id,name:c.name,parentId:c.parent_company_id,parentName:c.parent_company?.name||'',mode:c.management_mode||'개별관리',target:c.target_group||'',billing:c.billing_method||'',hospitalManager:c.hospital_manager_name||'',companyManager:c.company_manager_name||'',phone:c.company_manager_phone||'',period:c.period_text||'',vaccine:c.vaccine_name||'',note:c.note||''}}
async function loadCompanies(){const {data,error}=await sb.from('companies').select('id,name,parent_company_id,management_mode,target_group,billing_method,hospital_manager_name,company_manager_name,company_manager_phone,period_text,vaccine_name,note,parent_company:parent_company_id(name)').is('deleted_at',null).order('name');if(error)throw error;state.companies=(data||[]).map(mapCompany);return state.companies}
function hospitalShell(content){app.innerHTML=`${header('병원')}<div class="shell"><aside><button class="${state.tab==='companies'?'active':''}" onclick="state.tab='companies';hospital()">사업장 관리</button><button class="${state.tab==='members'?'active':''}" onclick="state.tab='members';hospital()">전체 명단</button></aside><main class="main">${content}</main></div>`}
async function hospital(){await loadCompanies();if(state.tab==='members')return hospitalMembers();const list=state.companies.filter(c=>(c.name+' '+c.parentName+' '+c.target+' '+c.billing+' '+c.hospitalManager).toLowerCase().includes(state.q.toLowerCase()));hospitalShell(`<div class="head"><div><h1>사업장 관리</h1><p>대상과 수납방법을 중심으로 사업장과 하위사업장을 관리합니다.</p></div><div class="actions"><button class="btn secondary" onclick="downloadCompanyTemplate()">기본 양식 다운로드</button><label class="btn secondary">양식 엑셀 등록<input class="hide" id="companyExcel" type="file" accept=".xlsx,.xls"></label><button class="btn primary" onclick="companyModal()">+ 사업장 추가</button></div></div><div class="panel"><div class="toolbar"><input class="search" id="searchCompany" placeholder="사업장·상위사업장·대상·담당자 검색" value="${esc(state.q)}"></div><div class="tablewrap"><table><thead><tr><th>구분</th><th>상위사업장</th><th>사업장명</th><th>관리방식</th><th>대상</th><th>수납방법</th><th>병원 담당자</th><th>기업 담당자</th><th>관리</th></tr></thead><tbody>${list.map(c=>`<tr><td>${c.parentId?'<span class="badge">하위</span>':'<span class="badge good">상위/일반</span>'}</td><td>${esc(c.parentName||'-')}</td><td class="${c.parentId?'child':''}"><b>${c.parentId?'↳ ':''}${esc(c.name)}</b></td><td>${esc(c.mode)}</td><td>${esc(c.target||'-')}</td><td><b>${esc(c.billing||'-')}</b></td><td>${esc(c.hospitalManager||'-')}</td><td>${esc(c.companyManager||'-')}</td><td><div class="actions"><button class="btn secondary" onclick="inviteCompany('${c.id}')">기업초대</button><button class="btn secondary" onclick="companyModal('${c.id}')">수정</button><button class="btn danger" onclick="deleteCompany('${c.id}')">삭제</button></div></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">사업장이 없습니다.</div>'}</div></div>`);$('#searchCompany').oninput=e=>{state.q=e.target.value;hospital()};$('#companyExcel').onchange=importCompanies}
async function hospitalMembers(){const {data,error}=await sb.from('participants').select('id,company_id,name,rrn_masked,phone,employee_no,department,position,relation,nationality,certificate_no,acquired_date,companies(name)').is('deleted_at',null).order('name');if(error)return alert(error.message);state.members=data||[];const list=state.members.filter(m=>(m.name+' '+(m.companies?.name||'')+' '+(m.phone||'')+' '+(m.rrn_masked||'')).toLowerCase().includes(state.q.toLowerCase()));hospitalShell(`<div class="head"><div><h1>전체 명단</h1><p>사업장별 등록 명단 확인용 화면입니다.</p></div></div><div class="panel"><div class="toolbar"><input class="search" id="searchMember" placeholder="사업장·성명·연락처 검색" value="${esc(state.q)}"></div>${memberTable(list,true)}</div>`);$('#searchMember').oninput=e=>{state.q=e.target.value;hospitalMembers()}}
function companyModal(id=''){const c=state.companies.find(x=>x.id===id)||{name:'',parentId:'',mode:'개별관리',target:'',billing:'후불',hospitalManager:'',companyManager:'',phone:'',period:'',vaccine:'독감',note:''};document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2>${id?'사업장 수정':'사업장 추가'}</h2><button class="btn ghost" onclick="modal.remove()">닫기</button></div><form id="companyForm"><label>사업장명 *<input name="name" value="${esc(c.name)}" required></label><div class="two"><label>상위사업장<select name="parent"><option value="">없음</option>${state.companies.filter(x=>x.id!==id&&!x.parentId).map(x=>`<option value="${x.id}" ${c.parentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>관리방식<select name="mode"><option ${c.mode==='개별관리'?'selected':''}>개별관리</option><option ${c.mode==='통합관리'?'selected':''}>통합관리</option></select></label></div><div class="two"><label>대상 *<input name="target" value="${esc(c.target)}" placeholder="예: 직원 및 가족" required></label><label>수납방법 *<select name="billing"><option ${c.billing==='선불'?'selected':''}>선불</option><option ${c.billing!=='선불'?'selected':''}>후불</option></select></label></div><div class="two"><label>병원 담당자<input name="hospitalManager" value="${esc(c.hospitalManager)}"></label><label>기업 담당자<input name="companyManager" value="${esc(c.companyManager)}"></label></div><label>기업 담당자 연락처<input name="phone" value="${esc(c.phone)}"></label><div class="two"><label>접종기간<input name="period" value="${esc(c.period)}"></label><label>백신<input name="vaccine" value="${esc(c.vaccine)}"></label></div><label>비고<textarea name="note">${esc(c.note)}</textarea></label><button class="btn primary">저장</button></form></div></div>`);$('#companyForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),payload={name:clean(f.get('name')),parent_company_id:f.get('parent')||null,management_mode:f.get('mode'),target_group:clean(f.get('target'))||null,billing_method:f.get('billing'),hospital_manager_name:clean(f.get('hospitalManager'))||null,company_manager_name:clean(f.get('companyManager'))||null,company_manager_phone:clean(f.get('phone'))||null,period_text:clean(f.get('period'))||null,vaccine_name:clean(f.get('vaccine'))||null,note:clean(f.get('note'))||null};let error;if(id){({error}=await sb.rpc('update_company_simple',{p_company_id:id,p_name:payload.name,p_parent_company_id:payload.parent_company_id,p_management_mode:payload.management_mode,p_target_group:payload.target_group,p_billing_method:payload.billing_method,p_hospital_manager_name:payload.hospital_manager_name,p_company_manager_name:payload.company_manager_name,p_company_manager_phone:payload.company_manager_phone,p_period_text:payload.period_text,p_vaccine_name:payload.vaccine_name,p_note:payload.note}))}else{({error}=await sb.from('companies').insert(payload))}if(error)return alert(error.message);$('#modal').remove();hospital()}}
async function deleteCompany(id){if(!confirm('이 사업장을 삭제하시겠습니까?\n하위사업장이 있는 상위사업장은 먼저 하위사업장을 정리해야 합니다.'))return;const {error}=await sb.rpc('soft_delete_company',{p_company_id:id});if(error)return alert(error.message);hospital()}
async function inviteCompany(id){const {data,error}=await sb.rpc('create_company_invite',{p_company_id:id,p_expires_at:new Date(Date.now()+7*86400000).toISOString()});if(error)return alert(error.message);const u=location.origin+location.pathname+'#company-invite/'+data;await navigator.clipboard?.writeText(u);alert('기업 담당자 초대 링크를 복사했습니다.\n'+u)}
function downloadCompanyTemplate(){downloadXlsx([{'상위사업장명':'','사업장명':'금호피앤비','관리방식':'통합관리','대상':'직원 및 가족','수납방법':'후불','병원담당자':'','기업담당자':'','기업담당자연락처':'','접종기간':'~10/31','백신':'독감','비고':'상위사업장 예시'},{'상위사업장명':'금호피앤비','사업장명':'케이지켐','관리방식':'개별관리','대상':'직원','수납방법':'후불','병원담당자':'','기업담당자':'','기업담당자연락처':'','접종기간':'~10/31','백신':'독감','비고':'하위사업장 예시'}],'사업장등록','뉴고려병원_사업장등록_기본양식.xlsx',['열 제목을 변경하지 않습니다.','수납방법은 선불/후불만 입력합니다.','통합관리: 상위 담당자가 하위 명단까지 관리 / 개별관리: 각 사업장이 자기 명단 관리'])}
async function importCompanies(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;const rows=readExcel(file,async rows=>{const req=['상위사업장명','사업장명','관리방식','대상','수납방법','병원담당자','기업담당자','기업담당자연락처','접종기간','백신','비고'];if(!req.every(h=>Object.prototype.hasOwnProperty.call(rows[0]||{},h)))return alert('기본 양식이 아닙니다. 먼저 기본 양식을 다운로드해 작성해 주세요.');await loadCompanies();const ids=new Map(state.companies.map(c=>[c.name,c.id]));let ok=0,fail=[];for(const r of rows){const name=clean(r['사업장명']);if(!name)continue;const billing=clean(r['수납방법']);if(!['선불','후불'].includes(billing)){fail.push(name+': 수납방법 오류');continue}const mode=clean(r['관리방식'])||'개별관리';if(!['통합관리','개별관리'].includes(mode)){fail.push(name+': 관리방식 오류');continue}const parentName=clean(r['상위사업장명']),parentId=parentName?(ids.get(parentName)||null):null;if(parentName&&!parentId){fail.push(name+': 상위사업장 없음');continue}const {data,error}=await sb.from('companies').insert({name,parent_company_id:parentId,management_mode:mode,target_group:clean(r['대상'])||null,billing_method:billing,hospital_manager_name:clean(r['병원담당자'])||null,company_manager_name:clean(r['기업담당자'])||null,company_manager_phone:clean(r['기업담당자연락처'])||null,period_text:clean(r['접종기간'])||null,vaccine_name:clean(r['백신'])||null,note:clean(r['비고'])||null}).select('id').single();if(error)fail.push(name+': '+error.message);else{ids.set(name,data.id);ok++}}alert(`사업장 등록 완료\n성공 ${ok}건${fail.length?`\n실패 ${fail.length}건\n- ${fail.slice(0,8).join('\n- ')}`:''}`);hospital()});}
function readExcel(file,cb){const fr=new FileReader();fr.onload=()=>{const wb=XLSX.read(fr.result,{type:'array'});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))};fr.readAsArrayBuffer(file)}function downloadXlsx(rows,sheet,file,guide=[]){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),sheet);if(guide.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(guide.map(x=>[x])),'작성안내');XLSX.writeFile(wb,file)}
async function company(){await loadCompanies();if(!state.selectedCompany||!state.companies.some(c=>c.id===state.selectedCompany))state.selectedCompany=profile?.company_id||state.companies[0]?.id;if(!state.selectedCompany)return app.innerHTML=header('기업')+'<div class="empty">사업장 정보가 없습니다.</div>';await loadCompanyMembers();renderCompany()}
async function loadCompanyMembers(){const {data,error}=await sb.from('participants').select('id,company_id,name,rrn_masked,phone,employee_no,department,position,relation,nationality,certificate_no,acquired_date').eq('company_id',state.selectedCompany).is('deleted_at',null).order('name');if(error)alert(error.message);state.members=data||[]}
function renderCompany(){const c=state.companies.find(x=>x.id===state.selectedCompany),root=state.companies.find(x=>x.id===profile?.company_id)||c;app.innerHTML=`${header('기업 고객')}<main class="main"><div class="hero"><div><div class="sub" style="color:#cfe3df">기업 고객용</div><h1>${esc(root.name)}</h1><div>직원 예방접종 명단 관리</div></div>${state.companies.length>1?`<select id="companySelect">${state.companies.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.parentId?'↳ ':''}${esc(x.name)}</option>`).join('')}</select>`:''}</div><div class="tabs"><button class="${state.tab!=='link'&&state.tab!=='info'?'active':''}" onclick="state.tab='members';renderCompany()">직원 명단</button><button class="${state.tab==='link'?'active':''}" onclick="state.tab='link';renderCompany()">직원 등록 링크</button><button class="${state.tab==='info'?'active':''}" onclick="state.tab='info';renderCompany()">사업장 정보</button></div>${state.tab==='link'?companyLink(c):state.tab==='info'?companyInfo(c):companyMembers(c)}</main>`;const sel=$('#companySelect');if(sel)sel.onchange=async e=>{state.selectedCompany=e.target.value;await loadCompanyMembers();renderCompany()};const fi=$('#memberExcel');if(fi)fi.onchange=importMembers}
function companyMembers(c){return `<div class="panel"><div class="head" style="padding:18px;margin:0"><div><h1 style="font-size:21px">${esc(c.name)} 명단</h1><p>기본 양식에 맞춰 등록하거나 직접 추가합니다.</p></div><div class="actions"><button class="btn secondary" onclick="downloadMemberTemplate()">기본 양식 다운로드</button><label class="btn secondary">양식 엑셀 등록<input id="memberExcel" class="hide" type="file" accept=".xlsx,.xls"></label><button class="btn primary" onclick="memberModal('${c.id}')">+ 직접 추가</button></div></div>${memberTable(state.members,false)}</div>`}
function companyLink(c){return `<div class="panel linkbox"><h2>${esc(c.name)} 직원 등록 링크</h2><p>직원이 직접 입력하면 이 사업장 명단에 자동 등록됩니다.</p><button class="btn primary" onclick="makeRegLink('${c.id}')">등록 링크 생성</button><div id="linkOut"></div></div>`}function companyInfo(c){return `<div class="panel infogrid"><div class="info"><span>상위사업장</span><b>${esc(c.parentName||'없음')}</b></div><div class="info"><span>관리방식</span><b>${esc(c.mode)}</b></div><div class="info"><span>대상</span><b>${esc(c.target||'-')}</b></div><div class="info"><span>수납방법</span><b>${esc(c.billing||'-')}</b></div><div class="info"><span>접종기간</span><b>${esc(c.period||'-')}</b></div><div class="info"><span>문의</span><b>뉴고려병원 기업검진사업부</b></div></div>`}
function memberTable(rows,showCompany){return `<div class="tablewrap"><table><thead><tr>${showCompany?'<th>사업장</th>':''}<th>성명</th><th>주민번호</th><th>연락처</th><th>사번</th><th>부서</th><th>직급</th><th>관계</th><th>국적</th><th>증번호</th><th>자격취득일</th></tr></thead><tbody>${rows.map(r=>`<tr>${showCompany?`<td>${esc(r.companies?.name||'')}</td>`:''}<td><b>${esc(r.name)}</b></td><td>${esc(r.rrn_masked||'')}</td><td>${esc(r.phone||'')}</td><td>${esc(r.employee_no||'')}</td><td>${esc(r.department||'')}</td><td>${esc(r.position||'')}</td><td>${esc(r.relation||'')}</td><td>${esc(r.nationality||'')}</td><td>${esc(r.certificate_no||'')}</td><td>${esc(r.acquired_date||'')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">등록된 명단이 없습니다.</div>'}</div>`}
function downloadMemberTemplate(){downloadXlsx([{'하위사업장명':'','성명':'홍길동','주민등록번호':'900101-1234567','연락처':'010-0000-0000','사번':'A001','부서':'관리팀','직급':'대리','관계':'본인','국적':'대한민국','증번호':'','자격취득일':''}],'직원명단','기업_예방접종_직원명단_기본양식.xlsx',['열 제목을 변경하지 않습니다.','통합관리 상위사업장은 하위사업장명을 입력하면 해당 명단으로 등록됩니다.','하위사업장명이 비어 있으면 현재 선택 사업장으로 등록됩니다.'])}
async function importMembers(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;readExcel(file,async rows=>{const req=['하위사업장명','성명','주민등록번호','연락처','사번','부서','직급','관계','국적','증번호','자격취득일'];if(!req.every(h=>Object.prototype.hasOwnProperty.call(rows[0]||{},h)))return alert('기본 양식이 아닙니다. 먼저 기본 양식을 다운로드해 작성해 주세요.');const byName=new Map(state.companies.map(c=>[c.name,c.id]));let ok=0,fail=[];for(const r of rows){const name=clean(r['성명']),rrn=clean(r['주민등록번호']);if(!name&&!rrn)continue;const sub=clean(r['하위사업장명']),target=sub?byName.get(sub):state.selectedCompany;if(!target){fail.push(name+': 하위사업장 없음');continue}const {data,error}=await sb.rpc('save_participant_secure',{p_company_id:target,p_name:name,p_rrn:rrn,p_phone:clean(r['연락처'])||null,p_employee_no:clean(r['사번'])||null,p_department:clean(r['부서'])||null,p_position:clean(r['직급'])||null,p_relation:clean(r['관계'])||'본인',p_certificate_no:clean(r['증번호'])||null,p_acquired_date:clean(r['자격취득일'])||null,p_nationality:clean(r['국적'])||'대한민국',p_source:'excel'});if(error||!data)fail.push(name+': '+(error?.message||'실패'));else ok++}alert(`명단 등록 완료\n성공 ${ok}명${fail.length?`\n실패·중복 ${fail.length}명\n- ${fail.slice(0,8).join('\n- ')}`:''}`);await loadCompanyMembers();renderCompany()})}
function memberModal(companyId){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="memberModal"><div class="modalbox"><div class="modalhead"><h2>직원 직접 추가</h2><button class="btn ghost" onclick="memberModal.remove()">닫기</button></div><form id="memberForm"><div class="two"><label>성명 *<input name="name" required></label><label>관계<select name="relation"><option>본인</option><option>가족</option></select></label></div><label>주민등록번호 *<input name="rrn" placeholder="000000-0000000" required></label><div class="two"><label>연락처<input name="phone"></label><label>사번<input name="employee"></label></div><div class="two"><label>부서<input name="dept"></label><label>직급<input name="position"></label></div><div class="two"><label>증번호<input name="cert"></label><label>자격취득일<input type="date" name="acquired"></label></div><button class="btn primary">저장</button></form></div></div>`);$('#memberForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{data,error}=await sb.rpc('save_participant_secure',{p_company_id:companyId,p_name:f.get('name'),p_rrn:f.get('rrn'),p_phone:f.get('phone')||null,p_employee_no:f.get('employee')||null,p_department:f.get('dept')||null,p_position:f.get('position')||null,p_relation:f.get('relation'),p_certificate_no:f.get('cert')||null,p_acquired_date:f.get('acquired')||null,p_nationality:'대한민국',p_source:'company'});if(error||!data)return alert(error?.message||'저장 실패');$('#memberModal').remove();await loadCompanyMembers();renderCompany()}}
async function makeRegLink(id){const {data,error}=await sb.rpc('create_registration_link',{p_company_id:id,p_title:'예방접종 직원 등록',p_expires_at:new Date(Date.now()+30*86400000).toISOString(),p_max_registrations:null});if(error)return alert(error.message);const u=location.origin+location.pathname+'#register/'+data;$('#linkOut').innerHTML=`<div class="generated"><code>${esc(u)}</code><button class="btn secondary" onclick="navigator.clipboard.writeText('${u}')">복사</button></div>`}
async function employeeRegister(token){app.innerHTML=`<div class="auth"><div class="authbox">${brand()}<h1>예방접종 대상자 등록</h1><p class="muted">회사에서 전달받은 전용 링크입니다.</p><form id="reg"><label>성명 *<input name="name" required></label><div class="two"><label>관계<select name="relation"><option>본인</option><option>가족</option></select></label><label>연락처<input name="phone"></label></div><label>주민등록번호 *<input name="rrn" required placeholder="000000-0000000"></label><div class="two"><label>사번<input name="employee"></label><label>부서<input name="dept"></label></div><div class="two"><label>직급<input name="position"></label><label>국적<input name="nation" value="대한민국"></label></div><div class="two"><label>증번호<input name="cert"></label><label>자격취득일<input type="date" name="acquired"></label></div><label class="check"><input name="consent" type="checkbox" required> 예방접종 대상자 등록을 위한 개인정보 수집·이용에 동의합니다.</label><button class="btn primary">명단 등록</button></form><div id="msg"></div></div></div>`;$('#reg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{data,error}=await sb.rpc('register_participant_by_token',{p_token:token,p_name:f.get('name'),p_rrn:f.get('rrn'),p_phone:f.get('phone')||null,p_employee_no:f.get('employee')||null,p_department:f.get('dept')||null,p_position:f.get('position')||null,p_relation:f.get('relation'),p_certificate_no:f.get('cert')||null,p_acquired_date:f.get('acquired')||null,p_nationality:f.get('nation')||'대한민국',p_consent:true});if(error||!data)return $('#msg').innerHTML=`<div class="notice">${esc(error?.message||'등록 실패')}</div>`;app.innerHTML=`<div class="auth"><div class="authbox"><h1>등록이 완료되었습니다</h1><p>회사 담당자와 병원에서 명단을 확인할 수 있습니다.</p></div></div>`}}
function invitePage(token){app.innerHTML=`<div class="auth"><div class="authbox">${brand()}<h1>기업 담당자 등록</h1><form id="inv"><label>담당자 이름<input name="name" required></label><label>이메일<input name="email" type="email" required></label><label>비밀번호<input name="pw" type="password" minlength="8" required></label><button class="btn primary">가입/연결</button></form><div id="msg"></div></div></div>`;$('#inv').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let {data,error}=await sb.auth.signUp({email:f.get('email'),password:f.get('pw'),options:{data:{display_name:f.get('name')}}});if(error&&error.message.includes('registered'))({data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')}));if(error)return $('#msg').innerHTML=`<div class="notice">${esc(error.message)}</div>`;if(!data.session)return $('#msg').innerHTML='<div class="notice">이메일 인증 후 같은 초대 링크를 다시 열어 로그인해 주세요.</div>';const {error:ce}=await sb.rpc('claim_company_invite',{p_token:token,p_display_name:f.get('name')});if(ce)return $('#msg').innerHTML=`<div class="notice">${esc(ce.message)}</div>`;go('company')}}
window.addEventListener('hashchange',route);route();
</script></body></html>
